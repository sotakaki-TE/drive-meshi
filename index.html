<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ドライブめし</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap">
<style>
/* v02: 2問だけ聞いて3択を返す。地図なし。 */
:root{
  --bg:#f6f7f4; --panel:#ffffff; --fg:#17201b; --mute:#5d6a62; --line:#d9ded9;
  --accent:#0f6a3a; --accent-fg:#ffffff; --chip:#e6efe9; --warn:#b4541a; --warn-bg:#fbeee4; --hw:#1f4e8c;
  --font:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif; color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#121715; --panel:#1b2320; --fg:#eef2ee; --mute:#9aa89f; --line:#2c3833;
  --accent:#3fb577; --accent-fg:#0b1a11; --chip:#243a2e; --warn:#f0a06a; --warn-bg:#3a271a; --hw:#6fa3e8; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#121715; --panel:#1b2320; --fg:#eef2ee; --mute:#9aa89f; --line:#2c3833;
  --accent:#3fb577; --accent-fg:#0b1a11; --chip:#243a2e; --warn:#f0a06a; --warn-bg:#3a271a; --hw:#6fa3e8; color-scheme:dark; }
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-weight:500;font-size:16px;line-height:1.5;
  padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px;max-width:560px;margin-inline:auto}
header{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
h1{font-size:20px;font-weight:900;margin:0}
.road{font-size:12px;color:var(--mute);text-align:right;min-width:0;overflow-wrap:anywhere}
.q{margin-top:22px}
.q h2{font-size:15px;color:var(--mute);margin:0 0 8px;font-weight:700;letter-spacing:.04em}
.grid{display:grid;gap:10px;grid-template-columns:repeat(2,1fr)}
.grid.four{grid-template-columns:repeat(4,1fr)}
.opt{font:inherit;font-weight:900;font-size:22px;padding:18px 8px;border-radius:16px;border:2px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer;line-height:1.1}
.opt small{display:block;font-size:12px;font-weight:500;color:var(--mute);margin-top:4px}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-fg)}
.opt[aria-pressed="true"] small{color:var(--accent-fg);opacity:.85}
.opt.hw[aria-pressed="true"]{background:var(--hw);border-color:var(--hw);color:#fff}
.opt.hw[aria-pressed="true"] small{color:#fff}
.dest{display:flex;gap:8px;margin-top:10px}
.dest input{flex:1;min-width:0;font:inherit;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--fg)}
.go{margin-top:22px;width:100%;font:inherit;font-weight:900;font-size:22px;padding:18px;border-radius:16px;border:0;background:var(--accent);color:var(--accent-fg);cursor:pointer}
.go:disabled{opacity:.5;cursor:default}
.note{margin-top:10px;font-size:13px;color:var(--mute)}
.note.warn{color:var(--warn);background:var(--warn-bg);border-radius:10px;padding:8px 12px}
.opt:focus-visible,.go:focus-visible,input:focus-visible,.chipbtn:focus-visible,.back:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* result */
#result{display:none}
.lead{margin-top:18px;font-size:14px;color:var(--mute)}
.lead b{color:var(--fg);font-size:18px;display:block}
.cards{display:grid;gap:12px;margin-top:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:grid;gap:8px}
.card.top{border-color:var(--accent);border-width:2px}
.card .num{font-size:12px;color:var(--mute);font-weight:700;letter-spacing:.08em}
.card .name{font-size:21px;font-weight:900;line-height:1.2;text-wrap:balance}
.card .judge{font-size:15px}
.card .meta{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12px;background:var(--chip);border-radius:999px;padding:3px 10px}
.card .act{display:flex;gap:8px;margin-top:4px}
.card .act a{flex:1;text-align:center;font-weight:900;text-decoration:none;border-radius:12px;padding:12px;font-size:16px;border:2px solid var(--accent);color:var(--accent)}
.card .act a.nav{background:var(--accent);color:var(--accent-fg)}
.refine{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.chipbtn{font:inherit;font-weight:700;font-size:14px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer}
.chipbtn[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.back{margin-top:22px;width:100%;font:inherit;font-weight:700;font-size:16px;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer}
.foot{margin-top:28px;font-size:12px;color:var(--mute);line-height:1.6}
.foot button{font:inherit;font-size:12px;color:var(--mute);background:none;border:0;text-decoration:underline;cursor:pointer;padding:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <h1>ドライブめし</h1>
  <div class="road" id="road">位置はまだ取っていません</div>
</header>

<section id="ask">
  <div class="q">
    <h2>何分後に食べたい？</h2>
    <div class="grid four" id="minsGrid">
      <button class="opt" data-m="15">15<small>分後</small></button>
      <button class="opt" data-m="30" aria-pressed="true">30<small>分後</small></button>
      <button class="opt" data-m="60">60<small>分後</small></button>
      <button class="opt" data-m="90">90<small>分後</small></button>
    </div>
  </div>
  <div class="q">
    <h2>いま走っているのは？</h2>
    <div class="grid" id="roadGrid">
      <button class="opt hw" data-r="hw">高速道路<small>SA・PAを探す</small></button>
      <button class="opt" data-r="gen" aria-pressed="true">一般道<small>沿道の店を探す</small></button>
    </div>
  </div>
  <div class="q">
    <h2>目的地（分かれば。精度が上がります）</h2>
    <div class="dest"><input type="text" id="dest" placeholder="例：河口湖、軽井沢駅、鴨川シーワールド"></div>
  </div>
  <button class="go" id="go">探す</button>
  <div class="note" id="note">「探す」を押すと位置情報の許可を聞かれます</div>
</section>

<section id="result">
  <div class="lead" id="lead"></div>
  <div class="cards" id="cards"></div>
  <div class="refine" id="refine"></div>
  <button class="back" id="back">条件を変える</button>
</section>

<div class="foot">
  経路は OSRM（渋滞なし）、店と SA/PA は OpenStreetMap、道路名は Nominatim。混むと遅いか失敗します。
  <button id="demo">デモ：東京駅 → 河口湖で試す</button>
</div>

<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const OSRM='https://router.project-osrm.org/route/v1/driving/';
const OVERPASS='https://overpass-api.de/api/interpreter';
const NOMI='https://nominatim.openstreetmap.org/';
const FAMILY=/ガスト|サイゼリヤ|ジョナサン|デニーズ|ココス|バーミヤン|ジョイフル|びっくりドンキー|丸亀製麺|くら寿司|スシロー|はま寿司|かっぱ寿司|ロイヤルホスト|夢庵|和食さと|ミスタードーナツ|リンガーハット|やよい軒|大戸屋|ステーキ宮|ビッグボーイ|フォルクス|コメダ|不二家|グラッチェ|華屋与兵衛|しゃぶ葉|かつや|魚べい|ゆず庵|カウボーイ家族|とんでん|ジョリーパスタ|道の駅|レストラン/;
const FASTONLY=/マクドナルド|モスバーガー|吉野家|すき家|松屋|ケンタッキー|バーガーキング|ロッテリア|なか卯|てんや|日高屋|幸楽苑/;
const CUIS={japanese:'和食',ramen:'ラーメン',sushi:'寿司',udon:'うどん',soba:'そば',chinese:'中華',italian:'イタリアン',pizza:'ピザ',burger:'ハンバーガー',curry:'カレー',yakiniku:'焼肉',steak:'ステーキ',coffee_shop:'喫茶',family_restaurant:'ファミレス',noodle:'麺',seafood:'海鮮',korean:'韓国料理',indian:'インド料理',french:'フレンチ',tonkatsu:'とんかつ',tempura:'天ぷら',unagi:'うなぎ',yakitori:'焼き鳥',izakaya:'居酒屋',teishoku:'定食',donburi:'丼',okonomiyaki:'お好み焼き',gyudon:'牛丼',fried_chicken:'唐揚げ',sandwich:'サンドイッチ',regional:'郷土料理',western:'洋食',kaiseki:'会席',chicken:'鶏'};
const GENRE={wa:/和食|寿司|うどん|そば|定食|丼|とんかつ|天ぷら|うなぎ|会席|郷土/,men:/ラーメン|うどん|そば|麺/,yo:/イタリアン|ピザ|ハンバーガー|ステーキ|フレンチ|洋食|ファミレス/};

const st={mins:30,road:'gen',cur:null,heading:null,speed:null,pos:[],route:null,dest:null,items:[],filter:null,page:0,watch:null};
try{const d=localStorage.getItem('dm.dest');if(d)$('dest').value=d;}catch(e){}

// geo math
const R=6371000,rad=d=>d*Math.PI/180,deg=r=>r*180/Math.PI;
const dist=(a,b)=>{const dLat=rad(b.lat-a.lat),dLng=rad(b.lng-a.lng);const s=Math.sin(dLat/2)**2+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dLng/2)**2;return 2*R*Math.asin(Math.sqrt(s));};
const bearing=(a,b)=>{const y=Math.sin(rad(b.lng-a.lng))*Math.cos(rad(b.lat));const x=Math.cos(rad(a.lat))*Math.sin(rad(b.lat))-Math.sin(rad(a.lat))*Math.cos(rad(b.lat))*Math.cos(rad(b.lng-a.lng));return (deg(Math.atan2(y,x))+360)%360;};
const project=(a,brg,d)=>{const dr=d/R,b=rad(brg),la=rad(a.lat),lo=rad(a.lng);const la2=Math.asin(Math.sin(la)*Math.cos(dr)+Math.cos(la)*Math.sin(dr)*Math.cos(b));const lo2=lo+Math.atan2(Math.sin(b)*Math.sin(dr)*Math.cos(la),Math.cos(dr)-Math.sin(la)*Math.sin(la2));return {lat:deg(la2),lng:deg(lo2)};};
const angDiff=(a,b)=>{let d=Math.abs(a-b);return d>180?360-d:d;};
const km=m=>m<950?Math.round(m/100)*100+' m':(m/1000).toFixed(1)+' km';
const dir8=b=>['北','北東','東','南東','南','南西','西','北西'][Math.round(b/45)%8];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// inputs
$('minsGrid').addEventListener('click',e=>{const b=e.target.closest('.opt');if(!b)return;st.mins=+b.dataset.m;[...$('minsGrid').children].forEach(x=>x.setAttribute('aria-pressed',x===b));});
$('roadGrid').addEventListener('click',e=>{const b=e.target.closest('.opt');if(!b)return;st.road=b.dataset.r;[...$('roadGrid').children].forEach(x=>x.setAttribute('aria-pressed',x===b));});
$('back').onclick=()=>{$('result').style.display='none';$('ask').style.display='';};
function note(t,w){const n=$('note');n.textContent=t||'';n.className='note'+(w?' warn':'');}

// position
function startGeo(){return new Promise((res,rej)=>{
  if(!navigator.geolocation)return rej(new Error('このブラウザでは位置情報が使えません'));
  let done=false;
  if(st.watch!=null)navigator.geolocation.clearWatch(st.watch);
  st.watch=navigator.geolocation.watchPosition(p=>{
    const c={lat:p.coords.latitude,lng:p.coords.longitude};
    st.pos.push(c);if(st.pos.length>8)st.pos.shift();
    if(p.coords.heading!=null&&!isNaN(p.coords.heading)&&p.coords.speed>1)st.heading=p.coords.heading;
    else{const ps=st.pos.filter(q=>dist(q,c)>15);if(ps.length)st.heading=bearing(ps[ps.length-1],c);}
    if(p.coords.speed!=null&&!isNaN(p.coords.speed))st.speed=p.coords.speed;
    st.cur=c;describeRoad();
    if(!done){done=true;res();}
  },err=>{if(!done){done=true;rej(new Error(err.code===1?'位置情報が許可されませんでした。ブラウザの設定で許可してください':'位置を取得できませんでした（'+err.message+'）'));}},
  {enableHighAccuracy:true,maximumAge:3000,timeout:20000});
});}
let roadT=null;
function describeRoad(){clearTimeout(roadT);roadT=setTimeout(async()=>{
  try{const r=await fetch(`${NOMI}reverse?format=jsonv2&zoom=17&lat=${st.cur.lat}&lon=${st.cur.lng}`,{headers:{'Accept-Language':'ja'}});const j=await r.json();const a=j.address||{};
    const road=a.road||a.pedestrian||j.name||'';const town=a.city||a.town||a.village||a.state||'';
    $('road').textContent=`${town}${road?'・'+road:''}${st.heading!=null?'・'+dir8(st.heading)+'向き':''}`;
  }catch(e){$('road').textContent='位置取得中';}
},400);}

// demo
$('demo').onclick=()=>{st.cur={lat:35.6812,lng:139.7671};st.heading=250;st.speed=20;st.pos=[];$('dest').value='河口湖';$('road').textContent='千代田区・JR東京駅（デモ）・西向き';note('デモ位置をセットしました。「探す」を押してください');};

// go
$('go').onclick=async()=>{
  const go=$('go');go.disabled=true;
  try{
    if(!st.cur){note('位置を取得しています…');await startGeo();}
    const q=$('dest').value.trim();
    try{localStorage.setItem('dm.dest',q);}catch(e){}
    st.route=null;st.dest=null;
    if(q){note('目的地と経路を調べています…');await buildRoute(q);}
    note(st.road==='hw'?'この先のSA・PAを探しています…':'先の地点の周りの店を探しています…');
    st.items=st.road==='hw'?await searchHighway():await searchGeneral();
    st.filter=null;st.page=0;
    render();note('');
    $('ask').style.display='none';$('result').style.display='block';window.scrollTo(0,0);
  }catch(e){note(e.message||'失敗しました。少し待ってもう一度',true);}
  finally{go.disabled=false;}
};

async function buildRoute(q){
  const r=await fetch(`${NOMI}search?format=jsonv2&limit=1&countrycodes=jp&q=${encodeURIComponent(q)}`,{headers:{'Accept-Language':'ja'}});const j=await r.json();
  if(!j.length){note('目的地が見つからなかったので、向きから推定します',true);return;}
  st.dest={lat:+j[0].lat,lng:+j[0].lon,name:j[0].display_name.split(',')[0]};
  const rr=await fetch(`${OSRM}${st.cur.lng},${st.cur.lat};${st.dest.lng},${st.dest.lat}?overview=full&geometries=geojson&annotations=duration`);const rj=await rr.json();
  if(rj.code!=='Ok')return;
  const rt=rj.routes[0];const coords=rt.geometry.coordinates.map(c=>({lat:c[1],lng:c[0]}));
  const cum=[0];rt.legs.forEach(l=>l.annotation.duration.forEach(d=>cum.push(cum[cum.length-1]+d)));
  st.route={coords,cum,total:rt.duration};
}
function pointAt(sec){const {coords,cum}=st.route;if(sec>=cum[cum.length-1])return coords[coords.length-1];let i=0;while(cum[i+1]<sec)i++;const f=(sec-cum[i])/Math.max(1e-6,cum[i+1]-cum[i]);return {lat:coords[i].lat+(coords[i+1].lat-coords[i].lat)*f,lng:coords[i].lng+(coords[i+1].lng-coords[i].lng)*f};}
function etaOnRoute(p){ // seconds to nearest route vertex within 1.5km, else null
  const {coords,cum}=st.route;let best=null,bd=1500;for(let i=0;i<coords.length;i+=2){const d=dist(p,coords[i]);if(d<bd){bd=d;best=i;}}return best==null?null:cum[best];
}
function futurePoint(){
  if(st.route)return pointAt(st.mins*60);
  const v=(st.speed&&st.speed>3)?st.speed:(st.road==='hw'?80:40)/3.6;
  const h=st.heading!=null?st.heading:0;
  return project(st.cur,h,v*st.mins*60*0.8);
}
const OP_SERVERS=['https://overpass-api.de/api/interpreter','https://overpass.private.coffee/api/interpreter','https://overpass.kumi.systems/api/interpreter'];
async function overpass(q){
  let lastErr='';
  for(let i=0;i<OP_SERVERS.length;i++){
    const u=OP_SERVERS[i];const ac=new AbortController();const t=setTimeout(()=>ac.abort(),15000);
    try{
      note((i===0?'店舗データを取得中…':`別のサーバーで再試行中（${i+1}/${OP_SERVERS.length}）…`));
      const r=await fetch(u,{method:'POST',body:'data='+encodeURIComponent(q),signal:ac.signal});
      if(r.ok){const j=await r.json();if(Array.isArray(j.elements))return j.elements;}
      lastErr=String(r.status);
    }catch(e){lastErr=e.name==='AbortError'?'タイムアウト':e.message;}
    finally{clearTimeout(t);}
  }
  throw new Error('店舗データのサーバーが全部混んでいます（'+lastErr+'）。1〜2分おいてもう一度押してください');
}
const tagsOf=e=>{const t=e.tags||{};return {lat:e.lat??e.center?.lat,lng:e.lon??e.center?.lon,name:t['name:ja']||t.name||'',cuisine:t.cuisine,oh:t.opening_hours,brand:t.brand||'',parking:(t.parking&&t.parking!=='no')||t['parking:capacity']||t.amenity==='parking'?'あり':(t.parking==='no'?'なし':null),tags:t};};

// 高速：SA/PA を到着時刻順に
async function searchHighway(){
  const c=st.cur;const v=(st.speed&&st.speed>15)?st.speed:80/3.6;
  // 経路があれば mins-15 / mins / mins+30 分の3地点、なければ現在地から推定した3地点のまわり 12km ずつ
  const offs=[-15,0,30];
  const pts=offs.map(o=>{const m=Math.max(5,st.mins+o);return st.route?pointAt(Math.min(st.route.total,m*60)):project(c,st.heading??0,v*m*60*0.8);});
  const sel=pts.map(p=>`node["highway"~"^(services|rest_area)$"](around:12000,${p.lat.toFixed(4)},${p.lng.toFixed(4)});way["highway"~"^(services|rest_area)$"](around:12000,${p.lat.toFixed(4)},${p.lng.toFixed(4)});`).join('');
  const els=await overpass(`[out:json][timeout:20];(${sel});out center 120;`);
  let arr=els.map(tagsOf).filter(x=>x.lat!=null&&x.name).map(x=>{x.d=dist(c,x);x.b=bearing(c,x);
    if(st.route){const s=etaOnRoute(x);x.eta=s==null?null:s/60;x.onRoute=s!=null;}else{x.eta=x.d/v/60/0.8;x.onRoute=null;}return x;});
  if(st.route){arr=arr.filter(x=>x.onRoute);}
  else if(st.heading!=null){arr=arr.filter(x=>angDiff(x.b,st.heading)<=60);}
  arr=arr.filter(x=>x.d>1500);
  const seen=new Set();arr=arr.filter(x=>{const k=x.name.replace(/（.*?）|\(.*?\)|上り|下り|内回り|外回り/g,'');if(seen.has(k))return false;seen.add(k);return true;});
  arr.sort((a,b)=>Math.abs(a.eta-st.mins)-Math.abs(b.eta-st.mins));
  return arr.map(x=>{x.kind='hw';x.judge=`約${Math.round(x.eta)}分後に到着。${x.tags.highway==='services'?'SA。食事処とトイレあり':'PA。軽食中心のことが多い'}${st.route?'':'（向きからの推定）'}`;return x;});
}
// 一般道：N分後の地点周辺
async function searchGeneral(){
  const p=futurePoint();st.fp=p;
  const els=await overpass(`[out:json][timeout:25];(node["amenity"~"^(restaurant|fast_food|food_court)$"](around:2500,${p.lat},${p.lng});way["amenity"~"^(restaurant|fast_food|food_court)$"](around:2500,${p.lat},${p.lng}););out center 120;`);
  let arr=els.map(tagsOf).filter(x=>x.lat!=null&&x.name).map(x=>{
    x.d=dist(p,x);x.kind='gen';x.cj=x.cuisine?x.cuisine.split(';').map(s=>CUIS[s.trim()]||s.trim()).join('・'):'';
    x.fam=FAMILY.test(x.name)||FAMILY.test(x.brand)||x.cuisine==='family_restaurant';x.fast=FASTONLY.test(x.name)||FASTONLY.test(x.brand);
    const sitdown=/ガスト|サイゼリヤ|ジョナサン|デニーズ|ココス|バーミヤン|ジョイフル|びっくりドンキー|くら寿司|スシロー|はま寿司|かっぱ寿司|ロイヤルホスト|夢庵|和食さと|ビッグボーイ|しゃぶ葉|とんでん|ジョリーパスタ|カウボーイ家族/.test(x.name+x.brand)||x.cuisine==='family_restaurant';
    if(x.cj==='fast_food')x.cj='軽食';
    x.score=(x.fam?40:0)+(sitdown?15:0)+(x.parking==='あり'?25:0)+(x.fast?-10:0)+(x.cj?5:0)-(x.d/100);
    const w=[];w.push(x.fam?'ファミリー向け。5人でも入りやすい':x.fast?'手早く済ませる向き':(x.cj||'ジャンル不明'));
    w.push(x.parking==='あり'?'駐車場あり':x.parking==='なし'?'駐車場なし':'駐車場は要確認');
    x.judge=w.join('。')+'。';return x;});
  arr.sort((a,b)=>b.score-a.score);
  return arr;
}

// render
function visible(){let a=st.items;if(st.filter){const g=GENRE[st.filter];a=a.filter(x=>g.test(x.cj||'')||g.test(x.name));}return a;}
function render(){
  const all=visible();const arr=all.slice(st.page*3,st.page*3+3);
  const lead=$('lead');
  if(st.road==='hw')lead.innerHTML=`<b>${st.mins}分後ごろに入れるSA・PA</b>${st.route?`${esc(st.dest.name)}までの経路上`:'進行方向から推定（目的地を入れると正確になります）'}`;
  else lead.innerHTML=`<b>${st.mins}分後の周辺で入りやすい順</b>${st.route?`${esc(st.dest.name)}への経路上の地点、半径2.5km`:'向きと速さからの推定地点、半径2.5km'}`;
  const C=$('cards');C.innerHTML='';
  if(!arr.length){C.innerHTML=`<div class="note warn">${st.road==='hw'?'進行方向にSA・PAが見つかりませんでした。一般道に切り替えるか、目的地を入れてください':'この条件では店が見つかりませんでした。分数を変えるか、絞り込みを外してください'}</div>`;}
  arr.forEach((x,i)=>{
    const n=st.page*3+i+1;const d=document.createElement('div');d.className='card'+(n===1?' top':'');
    const chips=[];
    if(x.kind==='gen'){if(x.cj)chips.push(x.cj);chips.push(`地点から${km(x.d)}`);if(x.oh)chips.push('営業時間 '+x.oh);}
    else{chips.push(`ここから${km(x.d)}`);}
    d.innerHTML=`<div class="num">${n===1?'いちばん無難':n+'番目'}</div><div class="name">${esc(x.name)}</div><div class="judge">${esc(x.judge)}</div>
      <div class="meta">${chips.map(c=>`<span class="chip">${esc(c)}</span>`).join('')}</div>
      <div class="act"><a class="nav" href="https://www.google.com/maps/dir/?api=1&destination=${x.lat},${x.lng}&travelmode=driving" target="_blank" rel="noopener">ナビ開始</a><a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(x.name)}%20${x.lat},${x.lng}" target="_blank" rel="noopener">写真・口コミ</a></div>`;
    C.appendChild(d);
  });
  const Rf=$('refine');Rf.innerHTML='';
  const mk=(label,on,fn)=>{const b=document.createElement('button');b.className='chipbtn';b.textContent=label;b.setAttribute('aria-pressed',!!on);b.onclick=fn;Rf.appendChild(b);};
  if(st.road==='gen'){[['wa','和食寄り'],['men','麺'],['yo','洋食・ファミレス']].forEach(([k,l])=>mk(l,st.filter===k,()=>{st.filter=st.filter===k?null:k;st.page=0;render();}));}
  if(all.length>(st.page+1)*3)mk('ほかの候補',false,()=>{st.page++;render();});
  if(st.page>0)mk('最初の3つに戻る',false,()=>{st.page=0;render();});
}
})();
</script>
